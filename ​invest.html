<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Opportunities | Safeguard Environments</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="nav-logo">Safeguard <span>Environments</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Isaac</a>
            <a href="invest.html" class="active nav-cta">Invest With Us</a>
        </div>
    </nav>

    <section class="container" style="padding-top: 120px;">
        <h1 class="section-title">Current Opportunities</h1>
        <div class="offerings-grid">
            <div class="offering-card">
                <p class="section-label">Real Estate</p>
                <h3>Hideaway Cove</h3>
                <p>Tulsa, OK | Multifamily</p>
            </div>
        </div>

        <div class="form-container">
            <h2 class="section-title">Investor Inquiry</h2>
            <p>Access our detailed investment thesis and upcoming pipeline by joining our accredited investor list.</p>
            <form action="https://formspree.io/f/YOUR_ID_HERE" method="POST">
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <select name="status">
                    <option value="Accredited">Accredited Investor</option>
                    <option value="Non-Accredited">Non-Accredited Investor</option>
                </select>
                <button type="submit" class="btn-primary">Request Access</button>
            </form>
        </div>
    </section>
</body>
</html>
